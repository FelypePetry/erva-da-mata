<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel da loja — Erva da Mata</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d1d15">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230d1d15'/%3E%3Cpath d='M50 14C74 30 80 58 50 86 20 58 26 30 50 14Z' fill='%23b6c878'/%3E%3Cpath d='M50 22V80' stroke='%230d1d15' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preload" href="assets/fonts/schibsted-grotesk.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="assets/css/loja.css">
<style>
body{background:var(--linho)}
/* login */
.login{min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,var(--mata3),var(--mata) 60%);color:var(--creme)}
.login .box{width:min(100%,420px);display:grid;gap:18px}
.login img{height:54px;width:auto}
.login h1{font-size:clamp(34px,7vw,48px)}
.login .card{color:var(--ink)}
.tabs{display:flex;gap:4px;padding:4px;background:var(--linho);border-radius:999px;margin-bottom:16px}
.tabs button{flex:1;min-height:40px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);transition:background .3s,color .3s}
.tabs button[aria-selected=true]{background:var(--mata);color:var(--creme)}
/* app */
.shell{display:grid;min-height:100svh}
@media (min-width:980px){.shell{grid-template-columns:240px 1fr}}
.side{background:var(--mata);color:var(--creme);padding:18px;display:flex;gap:6px;align-items:center;position:sticky;top:0;z-index:30;overflow-x:auto}
@media (min-width:980px){.side{flex-direction:column;align-items:stretch;height:100svh;padding:26px 18px}}
.side img{height:34px;width:auto;margin:0 10px 0 4px;flex:none;align-self:flex-start;border-radius:6px}
@media (min-width:980px){.side img{margin:0 6px 26px}}
.nav{text-decoration:none;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;font-weight:600;font-size:14.5px;color:rgba(243,235,216,.7);white-space:nowrap;transition:background .3s,color .3s}
.nav svg{width:18px;height:18px;flex:none}
.nav:hover{color:var(--creme);background:rgba(243,235,216,.06)}
.nav[aria-current=page]{background:var(--erva2);color:var(--mata)}
.side .me{margin-top:auto;font-size:12.5px;color:rgba(243,235,216,.55);padding:10px 14px;display:none}
@media (min-width:980px){.side .me{display:block}}
.main{padding:clamp(18px,3.5vw,40px);min-width:0}
.head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.head h1{font-size:clamp(30px,4.5vw,46px)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:20px}
.kpi{background:#fff;border-radius:18px;padding:18px;display:grid;gap:4px;animation:up .7s var(--ease) backwards;animation-delay:var(--d,0s)}
.kpi small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi b{font-size:28px;letter-spacing:-.02em}
.kpi.dark{background:var(--mata);color:var(--creme)}
.kpi.dark small{color:var(--erva2)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;background:#fff;font-size:13.5px;font-weight:600;color:var(--muted);transition:background .3s,color .3s}
.chip[aria-pressed=true]{background:var(--mata);color:var(--creme)}
.chip em{font-style:normal;opacity:.6;margin-left:4px}
.search{flex:1;min-width:200px;height:38px;border-radius:999px;border:0;background:#fff;padding:0 16px;outline:0}
.table{background:#fff;border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:70px 1.4fr 1fr 110px 180px;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-size:14.5px;cursor:pointer;transition:background .25s}
.row:hover{background:var(--papel)}
.row.h{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;cursor:default;background:#fff}
.row small{display:block;color:var(--muted);font-size:12.5px}
@media (max-width:760px){.row{grid-template-columns:1fr auto;gap:4px 12px}.row.h{display:none}.row>:nth-child(3){display:none}.row>:nth-child(1){grid-column:1}.row>:nth-child(4){text-align:right}}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--linho);white-space:nowrap}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tag.warn{color:#9a6312;background:#fbefd9}.tag.ok{color:#3c5a17;background:#e6eecb}.tag.bad{color:#9c3412;background:#fbe3d8}.tag.ship{color:#1f4d6b;background:#dcebf5}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
/* painel lateral do pedido */
.ov{position:fixed;inset:0;background:rgba(13,29,21,.5);opacity:0;pointer-events:none;transition:opacity .4s;z-index:60}
.ov.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(100%,520px);background:var(--papel);z-index:61;transform:translateX(105%);transition:transform .6s var(--ease);overflow-y:auto;padding:24px 24px 120px}
.panel.on{transform:none;box-shadow:-30px 0 80px -30px rgba(0,0,0,.4)}
.panel h2{font-size:30px}
.panel .blk{background:#fff;border-radius:16px;padding:16px 18px;margin-top:14px;font-size:14.5px}
.panel .blk h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
.panel .x{position:absolute;top:18px;right:18px;width:42px;height:42px;border-radius:50%;background:var(--linho);display:grid;place-items:center}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 12px}
.kv span{color:var(--muted)}
/* produtos */
.prods{display:grid;gap:12px}
.prod{background:#fff;border-radius:18px;padding:16px 18px;display:grid;gap:12px;grid-template-columns:48px 1fr;align-items:center;animation:up .6s var(--ease) backwards;animation-delay:var(--d,0s)}
.prod .sw{width:48px;height:48px;border-radius:14px;background:var(--c)}
.prod .ed{grid-column:1/-1;display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:860px){.prod{grid-template-columns:48px 1.2fr 2.6fr}.prod .ed{grid-column:auto;grid-template-columns:repeat(4,minmax(0,1fr)) auto}}
.mini{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.mini input{height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--papel);padding:0 12px;outline:0;font-size:15px;color:var(--ink);width:100%}
.mini input:focus{border-color:var(--erva);background:#fff}
.switch{position:relative;width:48px;height:28px;border-radius:999px;background:#d8d0bc;transition:background .3s;flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .4s var(--spring)}
.switch[aria-checked=true]{background:var(--erva)}
.switch[aria-checked=true]::after{transform:translateX(20px)}
.saved{font-size:12.5px;color:var(--erva);font-weight:700;opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
.cfg{display:grid;gap:14px;max-width:760px}
.ship-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.toast{position:fixed;left:50%;bottom:24px;z-index:90;transform:translate(-50%,30px);opacity:0;padding:12px 18px;border-radius:999px;background:var(--mata);color:var(--creme);font-size:14px;font-weight:600;transition:opacity .4s,transform .6s var(--spring);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- LOGIN -->
<section class="login" id="login" hidden>
  <div class="box reveal">
    <img src="assets/img/insta/logo.png" alt="Erva da Mata" width="170" height="54">
    <h1>Painel da <em>loja</em></h1>
    <form class="card" id="authForm" novalidate>
      <div class="tabs" role="tablist"><button type="button" role="tab" aria-selected="true" data-mode="in">Entrar</button><button type="button" role="tab" aria-selected="false" data-mode="up">Criar acesso</button></div>
      <div class="fields">
        <div class="f"><input id="aEmail" type="email" autocomplete="email" placeholder=" " required><label for="aEmail">E-mail</label></div>
        <div class="f"><input id="aPass" type="password" autocomplete="current-password" placeholder=" " minlength="8" required><label for="aPass">Senha (mínimo 8 caracteres)</label></div>
      </div>
      <button class="btn dark full" style="margin-top:16px" id="aBtn">Entrar</button>
      <div id="aMsg"></div>
      <p style="font-size:13px;color:var(--muted);margin-top:14px">Só e-mails cadastrados como administradores da loja têm acesso aos pedidos.</p>
    </form>
  </div>
</section>

<!-- APP -->
<div class="shell" id="shell" hidden>
  <nav class="side" aria-label="Painel">
    <img src="assets/img/insta/logo.png" alt="Erva da Mata" width="110" height="34">
    <a class="nav" href="#pedidos" data-view="pedidos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2Z"/><path d="M9 7h6M9 11h6"/></svg>Pedidos</a>
    <a class="nav" href="#produtos" data-view="produtos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3C18 7 19 14 12 21 5 14 6 7 12 3Z"/></svg>Produtos</a>
    <a class="nav" href="#config" data-view="config"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Configurações</a>
    <a class="nav" href="index.html" target="_blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>Ver loja</a>
    <button class="nav" id="logout" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>Sair</button>
    <span class="me" id="me"></span>
  </nav>
  <main class="main" id="view"></main>
</div>

<div class="ov" id="ov"></div>
<aside class="panel" id="panel" aria-hidden="true"></aside>
<div class="toast" id="toast" role="status"></div>

<script src="assets/js/loja.js"></script>
<script>
(() => {
'use strict';
const L = window.LOJA, $ = (s, c = document) => c.querySelector(s), $$ = (s, c = document) => [...c.querySelectorAll(s)];
const SKEY = 'edm-admin-session';
let session = null, orders = [], filter = 'todos', term = '';

/* ---------- autenticação (Supabase Auth via REST) ---------- */
async function auth(path, body) {
  const r = await fetch(`${L.SUPABASE_URL}/auth/v1/${path}`, { method: 'POST', headers: { apikey: L.SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.msg || j.error_description || j.message || 'Não foi possível entrar.');
  return j;
}
function keep(s) { session = { access_token: s.access_token, refresh_token: s.refresh_token, expires_at: Date.now() + (s.expires_in || 3600) * 1000, email: s.user?.email }; localStorage.setItem(SKEY, JSON.stringify(session)); }
async function token() {
  if (session && Date.now() > session.expires_at - 60000) {
    try { keep(await auth('token?grant_type=refresh_token', { refresh_token: session.refresh_token })); } catch (_) { logout(); throw new Error('Sessão expirada'); }
  }
  return session.access_token;
}
async function api(path, opts = {}) {
  const r = await fetch(`${L.SUPABASE_URL}/rest/v1/${path}`, { ...opts, headers: { apikey: L.SUPABASE_KEY, Authorization: `Bearer ${await token()}`, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (r.status === 401) { logout(); throw new Error('Sessão expirada'); }
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.message || `Erro ${r.status}`); }
  return r.status === 204 ? null : r.json();
}
function logout() { localStorage.removeItem(SKEY); session = null; $('#shell').hidden = true; $('#login').hidden = false; }
$('#logout').addEventListener('click', logout);

let mode = 'in';
$$('.tabs button').forEach(b => b.addEventListener('click', () => {
  mode = b.dataset.mode; $$('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  $('#aBtn').textContent = mode === 'in' ? 'Entrar' : 'Criar meu acesso'; $('#aMsg').innerHTML = '';
  $('#aPass').autocomplete = mode === 'in' ? 'current-password' : 'new-password';
}));
$('#authForm').addEventListener('submit', async e => {
  e.preventDefault(); const email = $('#aEmail').value.trim(), password = $('#aPass').value;
  if (!email || password.length < 8) { $('#aMsg').innerHTML = '<div class="alert">Informe o e-mail e uma senha com pelo menos 8 caracteres.</div>'; return; }
  const b = $('#aBtn'), t = b.textContent; b.disabled = true; b.innerHTML = '<span class="spin"></span>';
  try {
    if (mode === 'up') {
      const s = await auth('signup', { email, password });
      if (!s.access_token) { $('#aMsg').innerHTML = '<div class="alert info">Conta criada! Confirme pelo link que enviamos ao seu e-mail e depois entre aqui.</div>'; return; }
      keep(s);
    } else keep(await auth('token?grant_type=password', { email, password }));
    await start();
  } catch (err) { $('#aMsg').innerHTML = `<div class="alert">${L.esc(/Invalid login/i.test(err.message) ? 'E-mail ou senha incorretos.' : err.message)}</div>`; }
  finally { b.disabled = false; b.textContent = t; }
});

/* ---------- utilidades ---------- */
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); }
const tone = s => ({ enviado: 'ship', entregue: 'ok', pago: 'ok', em_separacao: 'ok', recusado: 'bad', cancelado: 'bad' }[s] || 'warn');
const tag = s => `<span class="tag ${tone(s)}">${(L.STATUS[s] || { label: s }).label}</span>`;
const dt = d => new Date(d).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const phoneFmt = p => { p = L.digits(p); return p.length === 11 ? `(${p.slice(0, 2)}) ${p.slice(2, 7)}-${p.slice(7)}` : p.length === 10 ? `(${p.slice(0, 2)}) ${p.slice(2, 6)}-${p.slice(6)}` : p; };

/* ---------- PEDIDOS ---------- */
const FILTERS = [['todos', 'Todos'], ['pagar', 'A pagar'], ['separar', 'Para separar'], ['enviado', 'Enviados'], ['entregue', 'Entregues'], ['cancelado', 'Cancelados']];
const match = (o, f) => f === 'todos' || (f === 'pagar' && ['pendente', 'aguardando_configuracao', 'recusado'].includes(o.status)) || (f === 'separar' && ['pago', 'em_separacao'].includes(o.status)) || o.status === f;
async function viewPedidos() {
  $('#view').innerHTML = `<div class="head"><div><p class="eyebrow">Vendas</p><h1>Pedidos</h1></div><button class="btn dark sm" id="reload">Atualizar</button></div><div id="kp"></div><div id="tb"></div><div class="table" id="list"><div class="empty"><span class="spin"></span></div></div>`;
  $('#reload').onclick = viewPedidos;
  try { orders = await api('orders?select=id,number,status,customer_name,customer_email,customer_phone,total,payment_method,shipping_service,created_at,paid_at,tracking_code&order=created_at.desc&limit=500'); }
  catch (e) { $('#list').innerHTML = `<div class="empty">${L.esc(e.message)}</div>`; return; }
  const paid = orders.filter(o => ['pago', 'em_separacao', 'enviado', 'entregue'].includes(o.status));
  const month = new Date(); month.setDate(1); month.setHours(0, 0, 0, 0);
  const mPaid = paid.filter(o => new Date(o.paid_at || o.created_at) >= month);
  const fat = mPaid.reduce((a, o) => a + Number(o.total), 0);
  $('#kp').innerHTML = `<div class="kpis">
    <div class="kpi dark"><small>Vendido no mês</small><b>${L.brl(fat)}</b></div>
    <div class="kpi" style="--d:.05s"><small>Pedidos pagos no mês</small><b>${mPaid.length}</b></div>
    <div class="kpi" style="--d:.1s"><small>Ticket médio</small><b>${L.brl(mPaid.length ? fat / mPaid.length : 0)}</b></div>
    <div class="kpi" style="--d:.15s"><small>Para separar</small><b>${orders.filter(o => match(o, 'separar')).length}</b></div></div>`;
  $('#tb').innerHTML = `<div class="toolbar">${FILTERS.map(([k, l]) => `<button class="chip" data-f="${k}" aria-pressed="${k === filter}">${l}<em>${orders.filter(o => match(o, k)).length}</em></button>`).join('')}<input class="search" id="q" placeholder="Buscar por nome, nº ou e-mail" value="${L.esc(term)}"></div>`;
  $$('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; $$('[data-f]').forEach(x => x.setAttribute('aria-pressed', x === b)); list(); });
  $('#q').oninput = e => { term = e.target.value; list(); };
  list();
}
function list() {
  const t = term.trim().toLowerCase();
  const rows = orders.filter(o => match(o, filter) && (!t || `${o.number} ${o.customer_name} ${o.customer_email}`.toLowerCase().includes(t)));
  $('#list').innerHTML = rows.length ? `<div class="row h"><span>Nº</span><span>Cliente</span><span>Entrega</span><span>Total</span><span>Status</span></div>` + rows.map(o => `
    <div class="row" data-id="${o.id}" tabindex="0" role="button"><b>#${o.number}</b><span>${L.esc(o.customer_name)}<small>${dt(o.created_at)}</small></span><span>${L.esc(o.shipping_service || '')}<small>${o.payment_method === 'pix' ? 'Pix' : 'Cartão'}</small></span><b>${L.brl(o.total)}</b><span>${tag(o.status)}</span></div>`).join('')
    : `<div class="empty">${orders.length ? 'Nenhum pedido neste filtro.' : 'Ainda não há pedidos. Quando alguém comprar no site, ele aparece aqui na hora.'}</div>`;
  $$('.row[data-id]').forEach(r => { r.onclick = () => openOrder(r.dataset.id); r.onkeydown = e => { if (e.key === 'Enter') openOrder(r.dataset.id); }; });
}
function closePanel() { $('#panel').classList.remove('on'); $('#ov').classList.remove('on'); $('#panel').setAttribute('aria-hidden', 'true'); }
$('#ov').onclick = closePanel; document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
async function openOrder(id) {
  const p = $('#panel'); p.innerHTML = '<div class="empty"><span class="spin"></span></div>'; p.classList.add('on'); $('#ov').classList.add('on'); p.setAttribute('aria-hidden', 'false');
  let o; try { [o] = await api(`orders?id=eq.${id}&select=*,order_items(name,quantity,unit_price,line_total)`); } catch (e) { p.innerHTML = `<div class="empty">${L.esc(e.message)}</div>`; return; }
  const a = o.address || {}, pickup = o.shipping_service_id === 'retirada';
  const first = o.customer_name.split(' ')[0];
  const waText = o.tracking_code ? `Olá, ${first}! Seu pedido #${o.number} da Erva da Mata foi enviado 🧉 Código de rastreio: ${o.tracking_code} — acompanhe em https://www.melhorrastreio.com.br/rastreio/${o.tracking_code}` : `Olá, ${first}! Aqui é da Erva da Mata, sobre o seu pedido #${o.number}.`;
  const phone = L.digits(o.customer_phone);
  p.innerHTML = `
    <button class="x" id="px" aria-label="Fechar"><svg width="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <p class="eyebrow">Pedido · ${dt(o.created_at)}</p><h2>#${o.number}</h2><div style="margin-top:10px">${tag(o.status)}</div>
    <div class="blk"><h3>Cliente</h3><div class="kv"><span>Nome</span><b>${L.esc(o.customer_name)}</b><span>E-mail</span><a href="mailto:${L.esc(o.customer_email)}">${L.esc(o.customer_email)}</a><span>Celular</span><span style="color:var(--ink)">${phoneFmt(o.customer_phone)}</span><span>CPF</span><span style="color:var(--ink)">${L.esc(o.customer_cpf)}</span></div>
      <a class="btn wa sm" style="margin-top:12px" target="_blank" rel="noopener" href="https://wa.me/55${phone}?text=${encodeURIComponent(waText)}">WhatsApp do cliente</a></div>
    <div class="blk"><h3>Entrega</h3><p><b>${L.esc(o.shipping_service || '')}</b> · ${Number(o.shipping_cost) ? L.brl(o.shipping_cost) : 'grátis'}</p>
      ${pickup ? '<p style="color:var(--muted)">Cliente vai retirar na loja.</p>' : `<p style="color:var(--muted)">${L.esc(a.rua)}, ${L.esc(a.numero)}${a.complemento ? ' — ' + L.esc(a.complemento) : ''}<br>${L.esc(a.bairro)} · ${L.esc(a.cidade)}/${L.esc(a.uf)} · CEP ${L.esc(String(a.cep || '').replace(/(\d{5})(\d{3})/, '$1-$2'))}</p>
      <button class="btn ghost sm" style="margin-top:10px" id="cpAddr">Copiar endereço</button>`}</div>
    <div class="blk"><h3>Itens</h3>${o.order_items.map(i => `<div style="display:flex;justify-content:space-between;gap:10px;padding:4px 0"><span>${i.quantity}× ${L.esc(i.name)}</span><b>${L.brl(i.line_total)}</b></div>`).join('')}
      <div style="border-top:1px solid var(--line);margin-top:8px;padding-top:8px;display:grid;gap:2px;font-size:14px">
      <div style="display:flex;justify-content:space-between"><span>Subtotal</span><span>${L.brl(o.subtotal)}</span></div>
      ${Number(o.discount) ? `<div style="display:flex;justify-content:space-between;color:var(--erva)"><span>Desconto Pix</span><span>− ${L.brl(o.discount)}</span></div>` : ''}
      <div style="display:flex;justify-content:space-between"><span>Frete</span><span>${L.brl(o.shipping_cost)}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:17px"><b>Total</b><b>${L.brl(o.total)}</b></div></div>
      <p style="color:var(--muted);font-size:13px;margin-top:8px">${o.payment_method === 'pix' ? 'Pix' : 'Cartão'}${o.mp_payment_id ? ` · Mercado Pago #${L.esc(o.mp_payment_id)} (${L.esc(o.mp_status)})` : ''}</p></div>
    <div class="blk"><h3>Atualizar pedido</h3>
      <div class="fields">
        <div class="f"><select id="pStatus">${Object.entries(L.STATUS).map(([k, v]) => `<option value="${k}" ${k === o.status ? 'selected' : ''}>${v.label}</option>`).join('')}</select><label for="pStatus">Status</label></div>
        <div class="f"><input id="pTrack" placeholder=" " value="${L.esc(o.tracking_code || '')}"><label for="pTrack">Código de rastreio</label></div>
        <div class="f"><textarea id="pNotes" placeholder=" ">${L.esc(o.admin_notes || '')}</textarea><label for="pNotes">Anotações internas</label></div>
      </div>
      <button class="btn dark full" style="margin-top:12px" id="pSave">Salvar alterações</button>
      <p style="font-size:12.5px;color:var(--muted);margin-top:10px">Pagamentos do Mercado Pago atualizam o status sozinhos. Ao colocar o rastreio, o status muda para "Enviado".</p></div>
    <div class="blk"><h3>Link do cliente</h3><button class="btn ghost sm" id="cpLink">Copiar link de acompanhamento</button></div>`;
  $('#px').onclick = closePanel;
  $('#pTrack').oninput = e => { if (e.target.value.trim() && ['pago', 'em_separacao'].includes($('#pStatus').value)) $('#pStatus').value = 'enviado'; };
  $('#cpAddr')?.addEventListener('click', () => { navigator.clipboard?.writeText(`${o.customer_name}\n${a.rua}, ${a.numero}${a.complemento ? ' - ' + a.complemento : ''}\n${a.bairro} - ${a.cidade}/${a.uf}\nCEP ${a.cep}`); toast('Endereço copiado'); });
  $('#cpLink').onclick = () => { navigator.clipboard?.writeText(new URL(`pedido.html?id=${o.id}&t=${o.access_token}`, location.href).href); toast('Link copiado'); };
  $('#pSave').onclick = async () => {
    const b = $('#pSave'); b.disabled = true;
    try {
      await api(`orders?id=eq.${o.id}`, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ status: $('#pStatus').value, tracking_code: $('#pTrack').value.trim() || null, admin_notes: $('#pNotes').value.trim() || null }) });
      toast('Pedido atualizado'); closePanel(); viewPedidos();
    } catch (e) { toast(e.message); } finally { b.disabled = false; }
  };
}

/* ---------- PRODUTOS ---------- */
async function viewProdutos() {
  $('#view').innerHTML = `<div class="head"><div><p class="eyebrow">Catálogo</p><h1>Produtos</h1></div></div><p class="sub" style="margin-bottom:16px">Preço, preço "de" (riscado), estoque e se aparece na loja. Estoque vazio = sem controle. O estoque baixa sozinho quando o pagamento é aprovado.</p><div class="prods" id="prods"><div class="empty"><span class="spin"></span></div></div>`;
  let ps; try { ps = await api('products?select=*&order=sort'); } catch (e) { $('#prods').innerHTML = `<div class="empty">${L.esc(e.message)}</div>`; return; }
  $('#prods').innerHTML = ps.map((p, i) => `
    <div class="prod" data-id="${L.esc(p.id)}" style="--d:${i * .04}s"><span class="sw" style="--c:${L.look(p.id)[0]}"></span>
      <div><b>${L.esc(p.name)}</b><small style="display:block;color:var(--muted)">${L.esc(p.weight_label || '')} · ${L.esc(p.kicker || '')}</small></div>
      <div class="ed">
        <label class="mini">Preço (R$)<input data-k="price" inputmode="decimal" value="${String(p.price).replace('.', ',')}"></label>
        <label class="mini">Preço "de" (R$)<input data-k="compare_at_price" inputmode="decimal" placeholder="—" value="${p.compare_at_price != null ? String(p.compare_at_price).replace('.', ',') : ''}"></label>
        <label class="mini">Estoque<input data-k="stock" inputmode="numeric" placeholder="sem controle" value="${p.stock ?? ''}"></label>
        <label class="mini">Na loja<span style="display:flex;align-items:center;gap:10px;height:42px"><button type="button" class="switch" role="switch" aria-checked="${p.active}" aria-label="Mostrar na loja"></button><span class="saved">Salvo ✓</span></span></label>
        <button class="btn dark sm" data-save style="align-self:end">Salvar</button>
      </div></div>`).join('');
  $$('.prod').forEach(row => {
    const sw = $('.switch', row); sw.onclick = () => sw.setAttribute('aria-checked', sw.getAttribute('aria-checked') !== 'true');
    $('[data-save]', row).onclick = async () => {
      const num = s => { s = String(s).trim().replace(/\./g, '').replace(',', '.'); return s === '' ? null : Number(s); };
      const body = { price: num($('[data-k=price]', row).value), compare_at_price: num($('[data-k=compare_at_price]', row).value), stock: $('[data-k=stock]', row).value.trim() === '' ? null : parseInt($('[data-k=stock]', row).value, 10), active: sw.getAttribute('aria-checked') === 'true' };
      if (!(body.price > 0) || (body.compare_at_price !== null && !(body.compare_at_price > 0)) || (body.stock !== null && !(body.stock >= 0))) { toast('Confira os valores'); return; }
      try { await api(`products?id=eq.${encodeURIComponent(row.dataset.id)}`, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(body) }); const s = $('.saved', row); s.classList.add('on'); setTimeout(() => s.classList.remove('on'), 1800); sessionStorage.removeItem('edm-products'); }
      catch (e) { toast(e.message); }
    };
  });
}

/* ---------- CONFIGURAÇÕES ---------- */
const UFS = ['RS', 'SC', 'PR', 'SP', 'RJ', 'MG', 'ES'];
async function viewConfig() {
  $('#view').innerHTML = `<div class="head"><div><p class="eyebrow">Loja</p><h1>Configurações</h1></div></div><div class="cfg" id="cfg"><div class="empty"><span class="spin"></span></div></div>`;
  let rows; try { rows = await api('settings?select=key,value'); } catch (e) { $('#cfg').innerHTML = `<div class="empty">${L.esc(e.message)}</div>`; return; }
  const s = Object.fromEntries(rows.map(r => [r.key, r.value])); const fb = s.fallback_shipping || {};
  $('#cfg').innerHTML = `
    <section class="card"><h2>Pagamento</h2><div class="fields">
      <div class="f h"><input id="cPix" inputmode="numeric" placeholder=" " value="${s.pix_discount_percent ?? 0}"><label for="cPix">Desconto no Pix (%)</label></div>
      <div class="f h"><input id="cInst" inputmode="numeric" placeholder=" " value="${s.max_installments ?? 1}"><label for="cInst">Parcelas máximas no cartão</label></div></div></section>
    <section class="card"><h2>Entrega</h2><div class="fields">
      <div class="f h"><input id="cFree" inputmode="decimal" placeholder=" " value="${s.free_shipping_min != null ? String(s.free_shipping_min).replace('.', ',') : ''}"><label for="cFree">Frete grátis acima de (R$) — vazio = não</label></div>
      <div class="f h"><input id="cOrig" inputmode="numeric" placeholder=" " value="${L.esc(s.origin_cep || '')}"><label for="cOrig">CEP de onde sai a mercadoria</label></div>
      <label class="f" style="display:flex;align-items:center;gap:12px"><button type="button" class="switch" id="cPick" role="switch" aria-checked="${s.pickup_enabled !== false}" aria-label="Retirada na loja"></button><span>Oferecer retirada na loja</span></label></div>
      <p class="eyebrow" style="margin:22px 0 10px">Tabela de frete reserva (usada se o Melhor Envio não responder)</p>
      <div class="ship-grid">${[...UFS, 'default'].map(u => `<label class="mini">${u === 'default' ? 'Outros' : u} (R$)<input data-uf="${u}" inputmode="decimal" value="${String(fb[u] ?? '').replace('.', ',')}"></label>`).join('')}</div></section>
    <section class="card"><h2>Contato</h2><div class="fields">
      <div class="f"><input id="cWa" inputmode="numeric" placeholder=" " value="${L.esc(s.whatsapp || '')}"><label for="cWa">WhatsApp da loja (55 + DDD + número)</label></div></div></section>
    <button class="btn dark" id="cSave">Salvar configurações</button>`;
  $('#cPick').onclick = e => e.currentTarget.setAttribute('aria-checked', e.currentTarget.getAttribute('aria-checked') !== 'true');
  $('#cSave').onclick = async () => {
    const dec = v => { v = String(v).trim().replace(',', '.'); return v === '' ? null : Number(v); };
    const fallback = { ...fb }; $$('[data-uf]').forEach(i => { const v = dec(i.value); if (v != null && v >= 0) fallback[i.dataset.uf] = v; });
    const upd = { pix_discount_percent: Math.max(0, Math.min(50, parseInt($('#cPix').value, 10) || 0)), max_installments: Math.max(1, Math.min(12, parseInt($('#cInst').value, 10) || 1)),
      free_shipping_min: dec($('#cFree').value), origin_cep: L.digits($('#cOrig').value), pickup_enabled: $('#cPick').getAttribute('aria-checked') === 'true',
      whatsapp: L.digits($('#cWa').value), fallback_shipping: fallback };
    const b = $('#cSave'); b.disabled = true;
    try { await Promise.all(Object.entries(upd).map(([k, v]) => api(`settings?key=eq.${k}`, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ value: v }) }))); sessionStorage.removeItem('edm-settings'); toast('Configurações salvas'); }
    catch (e) { toast(e.message); } finally { b.disabled = false; }
  };
}

/* ---------- roteamento ---------- */
const VIEWS = { pedidos: viewPedidos, produtos: viewProdutos, config: viewConfig };
function route() { const v = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'pedidos'; $$('.nav[data-view]').forEach(a => a.toggleAttribute('aria-current', a.dataset.view === v)); $$('.nav[data-view]').forEach(a => a.dataset.view === v ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')); closePanel(); VIEWS[v](); }
window.addEventListener('hashchange', () => session && route());

async function start() {
  const ok = await api('admins?select=user_id&limit=1');
  if (!ok.length) { logout(); $('#aMsg').innerHTML = '<div class="alert">Este e-mail não tem acesso de administrador da loja.</div>'; return; }
  $('#login').hidden = true; $('#shell').hidden = false; $('#me').textContent = session.email || ''; route();
}
try { session = JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (_) {}
if (session) start().catch(() => logout()); else $('#login').hidden = false;
})();
</script>
</body>
</html>

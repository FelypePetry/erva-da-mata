<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seu pedido — Erva da Mata</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d1d15">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230d1d15'/%3E%3Cpath d='M50 14C74 30 80 58 50 86 20 58 26 30 50 14Z' fill='%23b6c878'/%3E%3Cpath d='M50 22V80' stroke='%230d1d15' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preload" href="assets/fonts/schibsted-grotesk.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="assets/css/loja.css">
</head>
<body>
<div class="bg-leaves" aria-hidden="true">
  <i style="--w:150px;--r:-20deg;--d:0s;right:-30px;top:30%"></i>
  <i style="--w:90px;--r:30deg;--d:-4s;left:3%;top:75%"></i>
</div>
<header class="top">
  <div class="top-in">
    <a class="brand" href="index.html" aria-label="Erva da Mata — página inicial"><img src="assets/img/insta/logo.png" alt="Erva da Mata" width="120" height="38"></a>
    <a class="back" href="index.html#produtos">Voltar à loja<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></a>
  </div>
</header>

<main class="page" id="app" aria-live="polite">
  <div class="card" style="text-align:center;padding:60px"><span class="spin" style="color:var(--erva)"></span></div>
</main>

<footer class="foot">
  <span>© Erva da Mata · São José do Inhacorá, RS · Desde 1999</span>
  <a href="mailto:contato@ervadamata.com.br">contato@ervadamata.com.br</a>
</footer>

<script src="assets/js/loja.js"></script>
<script>
(() => {
'use strict';
const L = window.LOJA, $ = s => document.querySelector(s);
const q = new URLSearchParams(location.search);
const id = q.get('id'), token = q.get('t');
const STEPS = [
  ['recebido', 'Pedido recebido', 'Recebemos sua lista de ervas.', '<path d="M5 12l4 4 10-10"/>'],
  ['pago', 'Pagamento aprovado', 'Confirmado pelo Mercado Pago.', '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/>'],
  ['em_separacao', 'Em separação', 'Pesando e embalando com cuidado.', '<path d="M4 8l8-4 8 4v8l-8 4-8-4Z"/><path d="M4 8l8 4 8-4M12 12v8"/>'],
  ['enviado', 'Enviado', 'A caminho da sua cuia.', '<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17" r="1.6"/><circle cx="17" cy="17" r="1.6"/>'],
  ['entregue', 'Entregue', 'Bom mate!', '<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/>'],
];
const ORDER = { aguardando_configuracao: 0, pendente: 0, recusado: 0, pago: 1, em_separacao: 2, enviado: 3, entregue: 4 };
let settings = {}, timer, lastStatus;

function burst() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const b = document.createElement('div'); b.className = 'burst';
  const cols = ['#b6c878', '#7f9c45', '#d9a050', '#dfe8b4'];
  b.innerHTML = Array.from({ length: 28 }, () => { const a = Math.random() * Math.PI * 2, d = 140 + Math.random() * 260;
    return `<i style="--c:${cols[Math.random() * 4 | 0]};--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d + 160}px;--r:${Math.random() * 720 - 360}deg"></i>`; }).join('');
  document.body.appendChild(b); setTimeout(() => b.remove(), 1800);
}

function render(o) {
  const st = L.STATUS[o.status] || { label: o.status, tone: 'warn', hint: '' };
  const idx = ORDER[o.status] ?? -1, cancelled = ['cancelado'].includes(o.status);
  const wa = settings.whatsapp || '555533160098';
  const waMsg = `Olá, Erva da Mata! Sou ${o.customer_name.split(' ')[0]}, pedido #${o.number}.`;
  const first = (o.customer_name || '').split(' ')[0];
  const fresh = q.has('novo') && o.status === 'aguardando_configuracao';
  $('#app').innerHTML = `
    <section class="status-hero reveal">
      <span class="num">Pedido #${o.number} · ${new Date(o.created_at).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long' })}</span>
      <h1>${o.status === 'pago' || idx > 1 ? `Tudo certo, ${L.esc(first)}!` : cancelled ? 'Pedido cancelado' : `Obrigado, ${L.esc(first)}!`}</h1>
      <p style="margin-bottom:18px">${st.hint}</p>
      <span class="pill ${st.tone}">${st.label}</span>
      ${o.pay_url ? `<div style="margin-top:22px;display:flex;gap:10px;flex-wrap:wrap"><a class="btn" href="${L.esc(o.pay_url)}">${o.status === 'recusado' ? 'Tentar pagar de novo' : o.payment_method === 'pix' ? 'Ver QR Code do Pix' : 'Concluir pagamento'}</a></div>` : ''}
      ${fresh ? `<div class="alert info" style="margin-top:20px">Loja em modo de demonstração: o pagamento online ainda não está ligado. O pedido foi registrado e a loja vai te chamar para combinar o pagamento.</div>` : ''}
    </section>

    <div class="grid" style="margin-top:22px">
      <div>
        <section class="card reveal" style="--d:.08s">
          <h2>Acompanhe</h2>
          ${cancelled ? `<p class="sub">Se você já pagou, o estorno é feito automaticamente pelo Mercado Pago.</p>` : `
          <ol class="timeline">${STEPS.map((s, i) => `<li class="${i < idx || (i === idx && i === 4) ? 'done' : i === idx ? 'now' : ''}${i === 0 && idx >= 0 ? ' done' : ''}">
            <span class="b"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${s[3]}</svg></span>
            <div><b>${s[1]}</b><small>${i === 1 && idx < 1 ? (o.status === 'recusado' ? 'Pagamento não aprovado.' : 'Aguardando a confirmação.') : s[2]}</small></div></li>`).join('')}</ol>`}
          ${o.tracking_code ? `<div class="track" style="margin-top:20px"><span>Código de rastreio</span><code id="code">${L.esc(o.tracking_code)}</code>
            <button class="btn ghost sm" id="copy" type="button">Copiar</button>
            <a class="btn dark sm" target="_blank" rel="noopener" href="https://www.melhorrastreio.com.br/rastreio/${encodeURIComponent(o.tracking_code)}">Rastrear</a></div>` : ''}
        </section>
        <section class="card reveal" style="--d:.14s">
          <h2>Entrega</h2>
          <p><b>${L.esc(o.shipping_service || '—')}</b></p>
          <p class="sub">${o.shipping_service_id === 'retirada' || /Retirar/.test(o.shipping_service || '') ? 'Retirada em São José do Inhacorá · RS. Chame no WhatsApp para combinar o horário.' : `${L.esc(o.city || '')}${o.uf ? ' · ' + L.esc(o.uf) : ''}${o.shipping_days ? ` · prazo de até ${o.shipping_days} dias úteis após o envio` : ''}`}</p>
          <a class="btn wa" style="margin-top:18px" target="_blank" rel="noopener" href="https://wa.me/${L.digits(wa)}?text=${encodeURIComponent(waMsg)}">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Z"/></svg>Falar sobre este pedido</a>
        </section>
      </div>
      <aside class="summary reveal" style="--d:.1s">
        <h2>Resumo</h2>
        <div class="items">${o.items.map(i => `<div class="it" style="grid-template-columns:1fr auto"><div><b>${i.quantity}× ${L.esc(i.name)}</b><small>${L.brl(i.unit_price)} cada</small></div><span class="v">${L.brl(i.line_total)}</span></div>`).join('')}</div>
        <div class="lines">
          <div><span class="muted">Subtotal</span><span>${L.brl(o.subtotal)}</span></div>
          ${Number(o.discount) ? `<div class="disc"><span>Desconto Pix</span><span>− ${L.brl(o.discount)}</span></div>` : ''}
          <div><span class="muted">Entrega</span><span>${Number(o.shipping_cost) ? L.brl(o.shipping_cost) : 'Grátis'}</span></div>
          <div class="total"><span>Total</span><span>${L.brl(o.total)}</span></div>
        </div>
        <p class="note">Pagamento: ${o.payment_method === 'pix' ? 'Pix' : 'Cartão de crédito'}${o.paid_at ? ` · aprovado em ${new Date(o.paid_at).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}` : ''}</p>
      </aside>
    </div>`;
  $('#copy')?.addEventListener('click', e => { navigator.clipboard?.writeText(o.tracking_code); e.target.textContent = 'Copiado!'; });
  if ((lastStatus && lastStatus !== o.status && o.status === 'pago') || (!lastStatus && q.has('novo'))) burst();
  lastStatus = o.status;
  document.title = `Pedido #${o.number} — ${st.label} · Erva da Mata`;
}

async function load() {
  try {
    const o = await L.rest('rpc/get_order_public', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ p_id: id, p_token: token }) });
    if (!o) throw new Error('nf');
    render(o);
    clearTimeout(timer);
    if (['pendente', 'aguardando_configuracao'].includes(o.status)) timer = setTimeout(load, 15000);
  } catch (e) {
    $('#app').innerHTML = `<section class="card" style="text-align:center;padding:56px 24px"><h2 style="justify-content:center">Pedido não encontrado</h2>
      <p class="sub" style="margin:10px auto 22px">Confira se o link está completo, igual ao que você recebeu.</p><a class="btn dark" href="index.html">Voltar à loja</a></section>`;
  }
}
if (!id || !token || !/^[0-9a-f-]{36}$/i.test(id) || !/^[0-9a-f-]{36}$/i.test(token)) { $('#app').innerHTML = `<section class="card" style="text-align:center;padding:56px 24px"><h2 style="justify-content:center">Link incompleto</h2><p class="sub" style="margin:10px auto 22px">Abra o link do pedido que você recebeu por e-mail ou WhatsApp.</p><a class="btn dark" href="index.html">Voltar à loja</a></section>`; }
else { L.settings().then(s => settings = s).catch(() => {}).finally(load); }
})();
</script>
</body>
</html>
